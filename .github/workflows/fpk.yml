name: fpk

# 飞牛 fnOS 应用包（.fpk）构建。
#
# 打包素材在本仓库 fpk/wb2apiplus/（模板源自 shuangji66/buildbot，MIT License，
# 见该仓库 LICENSE；appname 改为 wb2apiplus 以便与 FnDepot 的 wb2api 在同一台 NAS 共存）。
#
# 触发：binaries.yml 建好 Release（内含 linux amd64/arm64 的 zip）之后自动补发 fpk；
# 也可手动指定 tag 重跑。fnpack 是飞牛官方打包 CLI，第三方 fpk 无需官方签名，
# manifest 里 source=thirdparty 即为社区应用。
# 触发：与 binaries.yml 同一个 tag push。不能挂 release:published ——
# Release 是 binaries.yml 用 GITHUB_TOKEN 建的，GitHub 规定由 GITHUB_TOKEN
# 产生的事件不再触发新工作流（防递归），那条路永远不会亮。
# 因此这里要自己等 Release 及其 zip 就位，再开始打包。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 Release tag（留空 = 最新）"
        required: false
        type: string

concurrency:
  group: fpk-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # fnpack 与 fpk 内的产物都要按架构走：x86→amd64 runner，arm→arm64 runner。
    # 交叉跑不了：fnpack 本身是宿主架构二进制。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      APP_NAME: wb2apiplus
      FNPACK_VERSION: 1.2.3
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          [[ "$TAG" == v* ]] || { echo "不是 v* 标签：$TAG"; exit 1; }
          # 飞牛版本号只收纯数字分段，不能带 v 或字母；我们的时间标签 v2026.11.2.953
          # 去掉 v 正好是四段，直接用。
          VERSION="${TAG#v}"
          [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] && { echo "版本号 $VERSION 不符合飞牛格式"; exit 1; }
          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"
          echo "tag=$TAG version=$VERSION"

      - name: Wait for binaries.yml to publish the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 同一次 tag push 里 binaries.yml 才创建 Release 并上传 zip；
          # 它跑完之前这里是 404，所以轮询而不是直接下载。
          ZIP="wb2api-panel-${VERSION}-linux-${{ matrix.arch }}.zip"
          for i in $(seq 1 40); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                 --jq '.assets[].name' 2>/dev/null | grep -qx "$ZIP"; then
              echo "Release 已就绪（第 $i 次检查）"; exit 0
            fi
            sleep 30
          done
          echo "::error::等 20 分钟仍未看到 $ZIP；binaries.yml 可能失败了"
          exit 1

      - name: Download our own linux binary
        run: |
          set -euo pipefail
          ZIP="wb2api-panel-${VERSION}-linux-${{ matrix.arch }}.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP}"
          echo "下载 $URL"
          curl -fL --retry 3 "$URL" -o app.zip
          mkdir -p extract
          unzip -q -o app.zip -d extract
          BIN=$(find extract -type f -name wb2api | head -1)
          CFG=$(find extract -type f -name config.example.json | head -1)
          [[ -z "$BIN" ]] && { echo "zip 里没有 wb2api 二进制"; exit 1; }
          [[ -z "$CFG" ]] && { echo "zip 里没有 config.example.json"; exit 1; }
          file "$BIN"
          echo "WB2API_BIN=$BIN" >> "$GITHUB_ENV"
          echo "CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Stage fpk source tree
        run: |
          set -euo pipefail
          rm -rf "$APP_NAME"
          cp -r "fpk/$APP_NAME" "$APP_NAME"
          mkdir -p "$APP_NAME/app/bin"
          cp "$WB2API_BIN" "$APP_NAME/app/bin/wb2api"
          chmod 755 "$APP_NAME/app/bin/wb2api"
          cp "$CONFIG_FILE" "$APP_NAME/app/config.example.json"
          chmod 755 "$APP_NAME"/cmd/*
          find "$APP_NAME" -type f | sort

      - name: Fetch fnpack
        run: |
          set -euo pipefail
          SRC="https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-${{ matrix.arch }}"
          FB="https://raw.githubusercontent.com/shuangji66/buildbot/main/fnpack/fnpack-${FNPACK_VERSION}-linux-${{ matrix.arch }}"
          curl -fL --retry 3 "$SRC" -o fnpack || curl -fL --retry 3 "$FB" -o fnpack
          chmod +x fnpack
          ./fnpack --help 2>&1 | head -20 || true

      - name: Fill manifest placeholders
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_TEXT: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          if [[ -z "${CHANGELOG_TEXT:-}" ]]; then
            CHANGELOG_TEXT=$(gh release view "$TAG" --json body --jq '.body // ""' 2>/dev/null || true)
          fi
          # --generate-notes 在没有 PR 时只剩一行 "Full Changelog: ..."，
          # 对 NAS 上的安装者没有信息量，去掉它；整段空了就用跟随说明兜底。
          CHANGELOG_TEXT=$(printf '%s' "$CHANGELOG_TEXT" | sed '/^\*\*Full Changelog\*\*/d' | sed '/^[[:space:]]*$/d')
          [[ -z "$CHANGELOG_TEXT" ]] && CHANGELOG_TEXT="跟随上游更新至 ${VERSION}"
          export CHANGELOG_TEXT
          python3 - "$APP_NAME/manifest" "$VERSION" "${{ matrix.platform }}" <<'PY'
          import json, os, sys
          path, version, platform = sys.argv[1:4]
          changelog = os.environ["CHANGELOG_TEXT"].strip()
          with open(path, encoding="utf-8") as f:
              text = f.read()
          text = text.replace("${VERSION}", version)
          text = text.replace("${PLATFORM}", platform)
          # changelog 含中文/引号/斜杠，走 JSON 字符串转义，不用 sed。
          text = text.replace("${CHANGELOG}", json.dumps(changelog, ensure_ascii=False))
          for left in ("${VERSION}", "${PLATFORM}", "${CHANGELOG}"):
              assert left not in text, f"占位符 {left} 未被替换"
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY
          cat "$APP_NAME/manifest"

      - name: Build fpk
        run: |
          set -euo pipefail
          ./fnpack build "$APP_NAME"
          FPK=$(ls *.fpk | head -1)
          [[ -z "$FPK" ]] && { echo "fnpack 没有产出 .fpk"; exit 1; }
          FINAL="${APP_NAME}-${VERSION}-${{ matrix.platform }}.fpk"
          mv "$FPK" "$FINAL"
          echo "FINAL_FPK=$FINAL" >> "$GITHUB_ENV"
          ls -la "$FINAL"
          sha256sum "$FINAL"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$FINAL_FPK" --clobber

      - name: Keep fpk as artifact on manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.platform }}
          path: ${{ env.FINAL_FPK }}
          if-no-files-found: warn
