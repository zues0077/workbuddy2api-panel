name: upstream-watch

# 跟随上游 misakano7545/workbuddy2api-panel 的发布：
# 上游每出一个 Release（tag），我们就把 main 同步过去、用同一个 tag 号发我们自己的
# Release + GHCR 镜像 + fpk。版本号保持一致，方便回溯「我们的哪版对应上游哪版」。
#
# 只做快进或干净合并：一旦有冲突就 abort 并让这次运行失败，绝不自动取舍。
# 手动跑同样生效，需要指定上游 tag 时用 inputs.tag。
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定要跟的上游 tag（留空 = 上游最新 Release）"
        required: false
        type: string

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: write
  # 上游的提交动过 .github/workflows/*。GitHub 拒绝任何没有 workflows 权限的
  # GitHub App token 推送含工作流文件变更的引用，报
  # "refusing to allow a GitHub App to create or update workflow ... without
  # workflows permission"——合并本身是干净的，卡在推送这一步。
  workflows: write

env:
  UPSTREAM: misakano7545/workbuddy2api-panel

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
          git fetch -q upstream main --tags
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            WANT="${{ github.event.inputs.tag }}"
          else
            WANT=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          fi
          # 写进 $GITHUB_ENV 只对后续步骤可见，当前这一步里它仍是未绑定变量，
          # 所以下面要用 WANT 打印，别再引用 TAG。
          echo "TAG=$WANT" >> "$GITHUB_ENV"
          echo "目标上游 tag: $WANT"

      - name: Check whether already followed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "拿不到上游 tag，退出"; exit 1
          fi
          # 不能用「本地有没有这个 tag」判断：上一步 fetch upstream --tags 会把
          # 上游的标签全导入本地，于是任何 tag 都看起来「已跟过」，跟随逻辑永不触发。
          # 口径改成我们自己发布过没有——看我们的 Release，以及标签在不在 origin 上。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG 我们已经发过 Release，跳过本次跟随"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SKIP=false" >> "$GITHUB_ENV"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "TAG_ON_ORIGIN=true" >> "$GITHUB_ENV"
            echo "标签已在 origin 但没有 Release（上次发版失败），这次补跑 binaries"
          else
            echo "TAG_ON_ORIGIN=false" >> "$GITHUB_ENV"
          fi
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "代码已在 main 里，只差发版"
          else
            echo "需要先把 $TAG 的提交合进 main"
          fi

      - name: Sync main with upstream
        if: env.SKIP == 'false' && success()
        run: |
          set -euo pipefail
          # 提交者身份要落到仓库配置：只写在单条命令的 -c 上，第二条 merge 命令
          # 拿不到身份，会报 "Committer identity unknown" 并直接失败。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream/main 已全部包含在本地历史，无需合并"
            exit 0
          fi
          git merge --ff-only upstream/main || {
            echo "快进失败（我们有自己的提交），尝试干净合并"
            git merge --no-edit upstream/main || {
              echo "::error::与上游 main 存在冲突，已 abort。需要人工合并后再发版。"
              git merge --abort || true
              exit 1
            }
          }
          git push origin HEAD:main
          echo "main 已同步到 $(git rev-parse --short HEAD)"

      - name: Tag and let the release pipeline take over
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 用上游同号标签：我们的哪版对应上游哪版一目了然。
          # binaries（建 Release）/docker-ghcr/exe 都在 push v* 上触发，fpk 挂在 Release 之后。
          if [[ "$TAG_ON_ORIGIN" == "true" ]]; then
            echo "标签已存在，跳过推送，直接补跑 binaries.yml"
            gh workflow run binaries.yml --ref "$TAG"
            exit 0
          fi
          UP_COMMIT=$(git rev-list -n 1 "$TAG")
          # -f：上一步 fetch --tags 已在本地建了同名 tag，不加 -f 会报 already exists。
          git tag -f "$TAG" "$UP_COMMIT"
          git push origin "$TAG"
          echo "已推送 $TAG -> $UP_COMMIT（Release/镜像/exe/fpk 由各自工作流产出）"
