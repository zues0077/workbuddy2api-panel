name: upstream-watch

# 纯上游镜像：把 misakano7545/workbuddy2api-panel 的 main 同步进我们的 main。
# 不打 tag、不发版、不建 Release——本仓库唯一的产物线是 fusion.yml（sddvcm → fpk）。
#
# 只做快进或干净合并：一旦有冲突就 abort 并让这次运行失败，绝不自动取舍。
# 唯一的机械例外：上游自带的 binaries.yml / docker-ghcr.yml 我们已刻意删除（面板
# 发版线整体下线），但上游改这两个文件时会和我们「删除」产生 modify/delete 冲突、
# 或把文件「复活」进合并结果——这两种情况都按「维持删除」处理（git rm 后继续提交）。
# 其余任何路径的冲突仍然 abort 交人工。
on:
  schedule:
    # 每天一次，23:17 UTC = 北京时间 07:17：早上起来正好把上游前一天的提交收掉。
    - cron: "17 23 * * *"
  workflow_dispatch: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: write
  # 这里不能写 `workflows: write`：GITHUB_TOKEN 的 permissions 白名单里没有
  # workflows 这一项，写了整份工作流直接解析失败（dispatch 报
  # HTTP 422 Unexpected value 'workflows'，运行体 0 个 job、连日志都没有，
  # 列表里只显示文件路径）。上游只要动过 .github/workflows/*，GitHub App 身份的
  # GITHUB_TOKEN 就硬性拒推（"refusing to allow a GitHub App to create or update
  # workflow ... without workflows permission"），这个权限无法授予 GITHUB_TOKEN。
  # 唯一出路是用一个带 workflow scope 的 classic PAT，见下面 Resolve push token。

env:
  UPSTREAM: misakano7545/workbuddy2api-panel
  # 这两条流水线是「上游自带、我们刻意删除」的：同步时上游对它们的任何改动
  # 都不算冲突内容，直接维持删除。
  DROP_WORKFLOWS: ".github/workflows/binaries.yml .github/workflows/docker-ghcr.yml"

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 关键：不能让 checkout 把 GITHUB_TOKEN 写进 http.extraHeader。它一旦写上，
          # 优先级高于 push URL 里的凭据，我们塞的 FOLLOW_PAT 根本不生效，报错仍然是
          # 「refusing to allow a GitHub App to create or update workflow」——排查时
          # 很容易误判成 token 或提交身份的问题。反证：本地用同一个 token 直接
          # git push 改 .github/workflows/* 是成功的。
          persist-credentials: false

      - name: Resolve push token
        env:
          FOLLOW_PAT: ${{ secrets.FOLLOW_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$FOLLOW_PAT" ]]; then
            # 不用 heredoc：块标量里的行必须保持缩进，顶格写会把 run: | 直接截断，
            # 工作流解析失败（连 job 都不生成）。
            echo '::error::缺少 Actions secret FOLLOW_PAT，同步无法推送。'
            echo '::error::上游只要动过 .github/workflows/*，GITHUB_TOKEN 就推不动这引用，'
            echo '::error::且它产生的 push 永不级联触发工作流。'
            echo '::error::建一个 classic PAT（scopes: repo + workflow），再：'
            echo '::error::    gh secret set FOLLOW_PAT --repo <owner>/<repo>'
            exit 1
          fi
          echo "FOLLOW_PAT 已就位（用户身份推送）"

      - name: Resolve push identity
        env:
          GH_TOKEN: ${{ secrets.FOLLOW_PAT }}
        run: |
          set -euo pipefail
          # 合并提交落在 token 对应的真人名下，git log 里「谁跟的版」对得上。
          LOGIN=$(gh api user --jq .login)
          NOREPLY=$(gh api user --jq '"\(.id)+\(.login)@users.noreply.github.com"')
          echo "PUSH_LOGIN=$LOGIN" >> "$GITHUB_ENV"
          echo "PUSH_EMAIL=$NOREPLY" >> "$GITHUB_ENV"
          echo "合并提交将以 $LOGIN <$NOREPLY> 身份落库"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
          # 不带 --tags：本仓库已不再打 v* 标签，上游标签导进来只会误导排查。
          git fetch -q upstream main
          echo "upstream/main = $(git rev-parse --short upstream/main)"

      - name: Sync main with upstream
        env:
          FOLLOW_PAT: ${{ secrets.FOLLOW_PAT }}
        run: |
          set -euo pipefail
          # 提交者身份要落到仓库配置：只写在单条命令的 -c 上，第二条 merge 命令
          # 拿不到身份，会报 "Committer identity unknown" 并直接失败。
          git config user.name "$PUSH_LOGIN"
          git config user.email "$PUSH_EMAIL"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream/main 已全部包含在本地历史，无需同步"
            exit 0
          fi
          if git merge --ff-only upstream/main; then
            :
          else
            echo "快进失败（我们有自己的提交：workflows 裁剪 + fusion 线），尝试干净合并"
            if ! git merge --no-edit upstream/main; then
              # 机械化解我们刻意删除的路径：modify/delete 冲突 → 维持删除。
              DROPPED=false
              for f in $DROP_WORKFLOWS; do
                if git status --porcelain -- "$f" | grep -qE '^(UU|DU|UD|AU|UA|AA|DD)'; then
                  git rm --ignore-unmatch -f -- "$f"
                  DROPPED=true
                fi
              done
              if [[ "$DROPPED" == "true" ]]; then
                git commit --no-edit && echo "已按「维持删除」处理 $DROP_WORKFLOWS 的同步冲突"
              else
                echo "::error::与上游 main 存在非预期路径的冲突，已 abort。需要人工合并。"
                git merge --abort || true
                exit 1
              fi
            fi
          fi
          # checkout 配的 origin 用 GITHUB_TOKEN，这里换成显式 URL：PAT 是用户身份，
          # 才推得动含 .github/workflows/* 变更的引用。
          git push "https://x-access-token:${FOLLOW_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "main 已同步到 $(git rev-parse --short HEAD)"
