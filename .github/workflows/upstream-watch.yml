name: upstream-watch

# 跟随上游 misakano7545/workbuddy2api-panel 的发布：
# 上游每出一个 Release（tag），我们就把 main 同步过去、用同一个 tag 号发我们自己的
# Release + GHCR 镜像 + fpk。版本号保持一致，方便回溯「我们的哪版对应上游哪版」。
#
# 只做快进或干净合并：一旦有冲突就 abort 并让这次运行失败，绝不自动取舍。
# 手动跑同样生效，需要指定上游 tag 时用 inputs.tag。
on:
  schedule:
    # 每天一次，23:17 UTC = 北京时间 07:17：早上起来正好把上游前一天的发布收掉。
    # 上游发布不密集，每小时跑只会堆一堆空转的运行记录。
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "指定要跟的上游 tag（留空 = 上游最新 Release）"
        required: false
        type: string

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: write
  # 这里不能写 `workflows: write`：GITHUB_TOKEN 的 permissions 白名单里没有
  # workflows 这一项，写了整份工作流直接解析失败（dispatch 报
  # HTTP 422 Unexpected value 'workflows'，运行体 0 个 job、连日志都没有，
  # 列表里只显示文件路径）。上游只要动过 .github/workflows/*，GitHub App 身份的
  # GITHUB_TOKEN 就硬性拒推（"refusing to allow a GitHub App to create or update
  # workflow ... without workflows permission"），这个权限无法授予 GITHUB_TOKEN。
  # 唯一出路是用一个带 workflow scope 的 classic PAT，见下面 Resolve push token。

env:
  UPSTREAM: misakano7545/workbuddy2api-panel

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve push token
        env:
          FOLLOW_PAT: ${{ secrets.FOLLOW_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$FOLLOW_PAT" ]]; then
            # 不用 heredoc：块标量里的行必须保持缩进，顶格写会把 run: | 直接截断，
            # 工作流解析失败（连 job 都不生成）。
            echo '::error::缺少 Actions secret FOLLOW_PAT，跟随无法自动发版。'
            echo '::error::两个硬性限制叠在一起：GITHUB_TOKEN 既推不动含 .github/workflows/* 变更的引用，'
            echo '::error::它产生的 push/tag/Release 也不会级联触发别的工作流。'
            echo '::error::建一个 classic PAT（scopes: repo + workflow + write:packages），再：'
            echo '::error::    gh secret set FOLLOW_PAT --repo <owner>/<repo>'
            exit 1
          fi
          echo "FOLLOW_PAT 已就位（用户身份推送，才能触发后续 binaries/docker/exe/fpk）"

      - name: Fetch upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
          git fetch -q upstream main --tags
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            WANT="${{ github.event.inputs.tag }}"
          else
            WANT=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)
          fi
          # 写进 $GITHUB_ENV 只对后续步骤可见，当前这一步里它仍是未绑定变量，
          # 所以下面要用 WANT 打印，别再引用 TAG。
          echo "TAG=$WANT" >> "$GITHUB_ENV"
          echo "目标上游 tag: $WANT"

      - name: Check whether already followed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "拿不到上游 tag，退出"; exit 1
          fi
          # 不能用「本地有没有这个 tag」判断：上一步 fetch upstream --tags 会把
          # 上游的标签全导入本地，于是任何 tag 都看起来「已跟过」，跟随逻辑永不触发。
          # 口径改成我们自己发布过没有——看我们的 Release，以及标签在不在 origin 上。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG 我们已经发过 Release，跳过本次跟随"
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SKIP=false" >> "$GITHUB_ENV"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "TAG_ON_ORIGIN=true" >> "$GITHUB_ENV"
            echo "标签已在 origin 但没有 Release（上次发版失败），这次补跑 binaries"
          else
            echo "TAG_ON_ORIGIN=false" >> "$GITHUB_ENV"
          fi
          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "代码已在 main 里，只差发版"
          else
            echo "需要先把 $TAG 的提交合进 main"
          fi

      - name: Sync main with upstream
        if: env.SKIP == 'false' && success()
        env:
          FOLLOW_PAT: ${{ secrets.FOLLOW_PAT }}
        run: |
          set -euo pipefail
          # 提交者身份要落到仓库配置：只写在单条命令的 -c 上，第二条 merge 命令
          # 拿不到身份，会报 "Committer identity unknown" 并直接失败。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream/main 已全部包含在本地历史，无需合并"
            exit 0
          fi
          git merge --ff-only upstream/main || {
            echo "快进失败（我们有自己的提交），尝试干净合并"
            git merge --no-edit upstream/main || {
              echo "::error::与上游 main 存在冲突，已 abort。需要人工合并后再发版。"
              git merge --abort || true
              exit 1
            }
          }
          # checkout 配的 origin 用 GITHUB_TOKEN，这里换成显式 URL：PAT 是用户身份，
          # 既能推含工作流文件的引用，也算「人」的 push，才会触发 binaries/docker。
          git push "https://x-access-token:${FOLLOW_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "main 已同步到 $(git rev-parse --short HEAD)"

      - name: Tag and let the release pipeline take over
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.FOLLOW_PAT }}
        run: |
          set -euo pipefail
          # 用上游同号标签：我们的哪版对应上游哪版一目了然。
          # binaries（建 Release）/docker-ghcr/exe 都在 push v* 上触发，fpk 等 binaries 出 zip。
          if [[ "$TAG_ON_ORIGIN" == "true" ]]; then
            echo "标签已存在，跳过推送，直接补跑 binaries.yml"
            gh workflow run binaries.yml --ref "$TAG"
            exit 0
          fi
          UP_COMMIT=$(git rev-list -n 1 "$TAG")
          # -f：上一步 fetch --tags 已在本地建了同名 tag，不加 -f 会报 already exists。
          git tag -f "$TAG" "$UP_COMMIT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"
          echo "已推送 $TAG -> $UP_COMMIT（Release/镜像/exe/fpk 由各自工作流产出）"

      - name: Verify the chain actually started
        if: env.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.FOLLOW_PAT }}
        run: |
          set -euo pipefail
          # 这一看不是洁癖：GITHUB_TOKEN 建的 tag/Release 永不触发别的工作流，
          # 那种情况下这里会安静地什么都等不到，发版就丢了。PAT 在位时 20 秒内必然排上。
          sleep 20
          if gh run list --workflow binaries.yml --branch "$TAG" --limit 1 --json databaseId --jq '.[0].databaseId' | grep -qE '[0-9]'; then
            echo "binaries.yml 已为 $TAG 排上，链已接通"
          else
            echo "::error::推送成功但没有工作流被触发——说明推送用的还是 GITHUB_TOKEN 身份。请确认 FOLLOW_PAT 有效且带 workflow scope。"
            exit 1
          fi
